<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaaS benchmark dashboard</title>
<style>
body{font:15px system-ui,sans-serif;max-width:1100px;margin:32px auto;padding:0 18px;color:#17202a;background:#f6f7f9}main{background:white;padding:24px;border-radius:12px;box-shadow:0 2px 12px #0001}h1{margin-top:0}label{display:inline-flex;flex-direction:column;gap:5px;margin:8px 14px 8px 0}input,select,button{font:inherit;padding:7px;border:1px solid #ccd2d9;border-radius:6px}button{background:#216e4e;color:white;border:0;cursor:pointer}.stacks{display:flex;gap:12px;flex-wrap:wrap}.stacks label{flex-direction:row}.log{background:#17202a;color:#d7f9e9;padding:12px;height:230px;overflow:auto;white-space:pre-wrap;border-radius:8px}.status{margin:16px 0;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{border:1px solid #e0e4e8;border-radius:8px;padding:10px}.muted{color:#667085}
</style></head><body><main>
<h1>Benchmark dashboard</h1><p class="muted">Laboratorio local: los tests se ejecutan con Docker y los resultados se conservan en <code>benchmarks/results</code>.</p>
<form id="form"><label>Escenario<select id="scenario"><option value="mixed">Mixed Workload</option><option value="error">Error Storm</option></select></label>
<label>Tasas RPS<input id="rates" value="20" pattern="[0-9 ]+"></label><label>Repeticiones<input id="repeats" type="number" min="1" max="20" value="1"></label><label>Warm-up<input id="warmup" value="5s"></label><label>Duración<input id="duration" value="10s"></label>
<div class="stacks"><strong>Stacks:</strong><label><input type="checkbox" value="php" checked> PHP</label><label><input type="checkbox" value="python" checked> Python</label><label><input type="checkbox" value="kotlin" checked> Kotlin</label><label><input type="checkbox" value="node" checked> Node</label><label><input type="checkbox" value="go" checked> Go</label></div><p><button>Ejecutar test</button></p></form>
<div id="status" class="status">Listo.</div><pre id="log" class="log"></pre><h2>Resultados</h2><div id="results" class="grid"></div><h2>Historial</h2><div id="history"></div>
</main><script>
const $=id=>document.getElementById(id), status=$('status'), log=$('log');
function render(rows){$('results').innerHTML=rows.map(r=>`<div class="card"><b>${r.stack}</b><br>${r.offered_rps} RPS<br>p95: ${r.latency_ms?.p95??'—'} ms<br>fallos: ${((r.failure_rate||0)*100).toFixed(2)}%</div>`).join('')||'<span class="muted">Sin resultados todavía.</span>'}
async function history(){const rows=await fetch('/api/history').then(r=>r.json());$('history').innerHTML=rows.slice(0,10).map(r=>`<div class="card"><b>${r.id}</b> · ${r.scenario||'mixed'} · ${r.stacks||''}<br>${(r.summaries||[]).length} mediciones</div>`).join('')||'<span class="muted">No hay ejecuciones anteriores.</span>'}
history();
$('form').onsubmit=async e=>{e.preventDefault();log.textContent='';render([]);status.textContent='Lanzando…';const stacks=[...document.querySelectorAll('.stacks input:checked')].map(x=>x.value);const cfg={scenario:$('scenario').value,rates:$('rates').value,repeats:Number($('repeats').value),warmup:$('warmup').value,duration:$('duration').value,stacks};const run=await fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(cfg)}).then(r=>r.json());if(run.error){status.textContent=run.error;return}status.textContent=`Ejecutando ${run.id}…`;const stream=new EventSource(`/api/runs/${run.id}/events`);stream.onmessage=e=>{log.textContent+=JSON.parse(e.data).line+'\n';log.scrollTop=log.scrollHeight};stream.addEventListener('done',async e=>{const done=JSON.parse(e.data);status.textContent=done.status==='completed'?'Completado':'Falló';const h=await fetch('/api/history').then(r=>r.json());const current=h.find(x=>x.id===run.id);render(current?.summaries||[]);history();stream.close()})};
</script></body></html>
