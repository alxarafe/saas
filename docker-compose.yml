services:

  postgres:
    image: postgres:17
    container_name: saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  php-api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas-php-api
    restart: unless-stopped
    ports:
      - "18080:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  kotlin-api:
    build:
      context: .
      dockerfile: docker/kotlin/Dockerfile
    container_name: saas-kotlin-api
    restart: unless-stopped
    ports:
      - "18081:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  python-api:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: saas-python-api
    restart: unless-stopped
    ports:
      - "18082:3000"
    volumes:
      - ./python-api:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  node-api:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: saas-node-api
    restart: unless-stopped
    ports:
      - "18083:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  go-api:
    build:
      context: .
      dockerfile: docker/go/Dockerfile
    container_name: saas-go-api
    restart: unless-stopped
    ports:
      - "18084:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  bruno:
    build:
      context: .
      dockerfile: docker/bruno/Dockerfile
    container_name: saas-bruno
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      BASE_URL_PHP: http://php-api:3000
      BASE_URL_PYTHON: http://python-api:3000
      BASE_URL_KOTLIN: http://kotlin-api:3000
      BASE_URL_NODE: http://node-api:3000
      BASE_URL_GO: http://go-api:3000
    volumes:
      - ./tests/bruno:/tests
    depends_on:
      php-api:
        condition: service_healthy
      python-api:
        condition: service_healthy
      kotlin-api:
        condition: service_healthy
      node-api:
        condition: service_healthy
      go-api:
        condition: service_healthy
    command: ["tail", "-f", "/dev/null"]

volumes:
  postgres_data:
